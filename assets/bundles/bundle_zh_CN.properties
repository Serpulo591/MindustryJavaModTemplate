

# 文本

gz.glow-mine = 接近[blue]钴矿[]并点击以手动开采。
gz.glow-item = 点击启动钻机，并手动将物品运回核心。
gz.glow-drill = 建造更多钻机。
gz.glow-wall = 在核心周围至少建造20个钴墙。

bar.waterboost = [accent]2.56[#bfbfbf]x 速度

