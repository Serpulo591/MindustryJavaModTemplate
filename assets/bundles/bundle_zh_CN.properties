# 星球

planet.glow-vilacmin.name = 维拉克敏
planet.glow-vilacmin.description = 一颗荒芜星球。地表遍布冰蚀裂脊、干涸河床与风化岩台，大气稀薄，昼夜温差剧烈。
sector.glow-frostCrackedRidge.name = 霜裂岭
sector.glow-frostCrackedRidge.description = 这片着陆区敌人威胁低，但资源也相对贫瘠。尽快发展科技，然后继续前进。

# 方块

block.glow-conveyor1.name = 传送带
block.glow-conveyor1.description = 向前运输物品。
block.glow-high-carbon-conveyor.name = 高碳传送带
block.glow-high-carbon-conveyor.description = 高速运输物品。
block.glow-core-distributor.name = 核心分配器
block.glow-core-distributor.description = 可连接核心，并从核心中提取物品。需要装卸器辅助。
block.glow-warp-bridge.name = 迁跃桥
block.glow-warp-bridge.description = 远距离瞬间传输物品至目标迁跃桥，无视地形。
block.glow-core-origin.name = 源始核心
block.glow-core-origin.description = 基地的核心。拥有装甲。一旦被摧毁，该区块就会丢失。
block.glow-receptacle.name = 仓库
block.glow-receptacle.description = 少量存储各种类型的物品。可使用卸载器卸载物品。不会增加核心存储容量。
block.glow-vector-drill.name = 矢量钻头
block.glow-vector-drill.description = 高效电驱采矿设备，内置矢量驱动核心，可在缺电时手动启动或有电时提升采矿效率。
block.glow-biomass-reactor.name = 生物质反应堆
block.glow-biomass-reactor.description = 将生物质原料转化为稳定可用的电能。
block.glow-radioisotope-thermoelectric-generator.name = 同位素热电机
block.glow-radioisotope-thermoelectric-generator.description = 利用放射物衰变产生的热量缓慢地产生电力。
block.glow-micro-nodes.name = 微型节点
block.glow-micro-nodes.description = 一种微小的电力节点，连接范围有限。
block.glow-waste-generator.name = 废料发电机
block.glow-waste-generator.description = 通过燃烧废料产生电力的小型发电机。
block.glow-alloy-furnace.name = 合金窑炉
block.glow-alloy-furnace.description = 使用高压窑炉技术，将多种金属合成巨浪合金。
block.glow-blast-synthesizer.name = 爆炸物合成机
block.glow-blast-synthesizer.description = 将硫化物、煤和孢子荚混合制成爆炸混合物。
block.glow-high-carbon-alloy-kiln.name = 重碳合金炉
block.glow-high-carbon-alloy-kiln.description = 将钍、石墨、铅在高温高压下熔炼，制备高强度重碳合金。
block.glow-phase-loom.name = 相位物合成机
block.glow-phase-loom.description = 用钍和沙生产相位物。
block.glow-plastanium-synthesizer.name = 塑钢合成机
block.glow-plastanium-synthesizer.description = 使用铅、钛和石油生产塑钢。
block.glow-pyratite-synthesizer.name = 硫化物合成机
block.glow-pyratite-synthesizer.description = 将煤炭、铅和沙子与石油混合，通过化学反应合成硫化物。
block.glow-tempering-furnace.name = 钢化炉
block.glow-tempering-furnace.description = 通过水淬工艺将铅和沙子转化为钢化玻璃。
block.glow-silicon-crystal-condenser.name = 硅晶冷凝器
block.glow-silicon-crystal-condenser.description = 放置在冰火山气孔上方，利用低温凝华从蒸汽中提取粗制硅晶。需要电力。
block.glow-silicon-refinery.name = 硅洗练炉
block.glow-silicon-refinery-condenser.description = 用等离子弧烧除粗糙硅晶中的杂质，产出高纯度硅。
block.glow-aurora.name = 极光
block.glow-aurora.description = 向敌方发射高速穿透子弹，面对集群目标十分有效。
block.glow-thunderburst.name = 雷腾
block.glow-thunderburst.description = 向敌方一次性倾泻出毁灭性的弹幕，并造成范围伤害。
block.glow-corroding.name = 集束
block.glow-corroding.description = 向敌人发射追踪导弹。
block.glow-rainstorm.name = 骤雨
block.glow-rainstorm.description = 快速地向敌人发射标准子弹。
block.glow-volleyer.name = 连珠
block.glow-volleyer.description = 向敌方发射多段子弹。
block.glow-rendsky.name = 裂空
block.glow-rendsky.description = 向前方锥形区域发射子弹，并把敌人击退。
block.glow-meteor.name = 落星
block.glow-meteor.description = 向远距离地面敌人发射小型炮弹。
block.glow-perish.name = 俱灭
block.glow-perish.description = 向地面敌人发射巨大的爆炸炮弹，并震坏敌人武器，需要大量冷却液。
block.glow-glue.name = 胶粘剂
block.glow-glue.description = 减速地面单位。
block.glow-unit-assembler.name = 单位重设厂
block.glow-unit-assembler.description = 将输入的单位升级到EX版。
block.glow-unit-facility.name = 单位配装厂
block.glow-unit-facility.description = 生产单位，产出的单位可以直接投入战场，也可以送入重构工厂进行升级。
block.glow-worm-fabricator.name = 虫子制造厂
block.glow-worm-fabricator.description = 生产虫子单位，产出的虫子可以直接投入战场，也可以送入重构工厂进行升级。
block.glow-worm-assembler.name = 虫子组装厂
block.glow-worm-assembler.description = 利用输入的方块和虫子组装虫子。可以通过添加基本配装厂模块来增加输出等级。（不知道为什么，使用自定义单位作为建造条件时，会自动变为路由器，所以我就把建造条件改为坦克）
block.glow-cobalt-wall.name = 钴墙
block.glow-cobalt-wall.description = 保护己方建筑，挡下敌方炮弹。
block.glow-cobalt-wall-large.name = 大型钴墙
block.glow-cobalt-wall-large.description = 保护己方建筑，挡下敌方炮弹。
block.glow-cyan-chill-ball-headed-cat-with-bird-feet.name = 球头鸟足猫-青寒
block.glow-cyan-chill-ball-headed-cat-with-bird-feet.description = 这是一个由一只猫脸、球形头部与鸟类足部组合而成的生物的照片，它看起来很冷。
block.glow-healing-wall.name = 治愈墙
block.glow-healing-wall.description = 保护己方建筑，挡下敌方炮弹，能定期修复附近的建筑。
block.glow-healing-wall-large.name = 大型治愈墙
block.glow-healing-wall-large.description = 保护己方建筑，挡下敌方炮弹，能定期修复附近的建筑。
block.glow-red-hotball-ball-headed-cat-with-bird-feet.name = 球头鸟足猫-红温
block.glow-red-hotball-ball-headed-cat-with-bird-feet.description = 这是一个由一只猫脸、球形头部与鸟类足部组合而成的生物的照片，它看起来很热。
block.glow-titanium-steel-composite-wall.name = 钛钢复合墙
block.glow-titanium-steel-composite-wall.description = 保护己方建筑，挡下敌方炮弹。能吸收激光和电弧，但也会阻止电力节点自动连接。受攻击时间段释放电弧。
block.glow-titanium-steel-composite-wall-large.name = 大型钛钢复合墙
block.glow-titanium-steel-composite-wall-large.description = 保护己方建筑，挡下敌方炮弹。能吸收激光和电弧，但也会阻止电力节点自动连接。受攻击时间段释放电弧。

# 物品

item.glow-cobalt.name = 钴
item.glow-cobalt.description = 用于大多数建筑，或作为弹药使用。
item.glow-crude-silicon.name = 粗糙硅晶
item.glow-crude-silicon.description = 一种由冰火山凝华形成的脆性结晶沉积物。含有杂质，不可直接用于工业生产。
item.glow-high-carbon-alloy.name = 高碳合金
item.glow-high-carbon-alloy.description = 用于制造先进武器和弹药补给。

# 效果

status.glow-tremor.name = 震荡
status.glow-root.name = 神定

# 单位

unit.glow-weigh.name = 裁断
unit.glow-weigh.description = 保护源始核心，可建造建筑。
unit.glow-dig.name = 掘爪
unit.glow-dig.description = 自动开采矿物，并将其放入核心中。
unit.glow-worm.name = 蓄势待发
unit.glow-worm.description = 向敌人发射标准子弹与中程火炮。能够助推。
unit.glow-worm-1.name = 枪林弹雨
unit.glow-worm-1.description = 向周围快速发射大量子弹。能够助推。
unit.glow-worm-2.name = 玉石俱焚
unit.glow-worm-2.description = 冲向敌人并自毁，造成大范围爆炸。
unit.glow-worm-3.name = 生生不息
unit.glow-worm-3.description = 一种小型支援单位，可治疗己方建筑，并为其提供小型力场护盾。
unit.glow-worm-big.name = 雷霆万钧
unit.glow-worm-big.description = 使用武器组向敌人发射大量子弹。能够助推。
unit.glow-punisher.name = 惩击
unit.glow-punisher.description = 向敌方发射高速子弹。
unit.glow-punisher-EX.name = 惩击-EX
unit.glow-punisher-EX.description = 惩击的重设版，向敌方发射高速子弹。
unit.glow-razorglaive.name = 利戟
unit.glow-razorglaive.description = 向敌方发射多段子弹。
unit.glow-razorglaive-EX.name = 利戟-EX
unit.glow-razorglaive-EX.description = 利戟的重设版，向敌方发射多段子弹。
unit.glow-scatter.name = 扩幕
unit.glow-scatter.description = 向敌方发射多发子弹。
unit.glow-scatter-EX.name = 扩幕-EX
unit.glow-scatter-EX.description = 扩幕的重设版，向敌方发射多发子弹。
unit.glow-vanguard.name = 突击
unit.glow-vanguard.description = 向敌方高速发射子弹。
unit.glow-vanguard-EX.name = 突击-EX
unit.glow-vanguard-EX.description = 突击的重设版，向敌方高速发射子弹。

#整活单位

unit.glow-刀帝.name = 刀帝
unit.glow-刀帝.description = 当它的核心发出钟鸣声时，最好你已经跑得足够远了。
unit.glow-电锯狂魔.name = 电锯狂魔
unit.glow-电锯狂魔.description = 一台被遗忘在工业废料堆里的机械屠夫。沉重的链锯引擎一旦启动，便会发出撕心裂肺的轰鸣。
unit.glow-耍大刀.name = 耍大刀
unit.glow-耍大刀.description = 别被它那笨拙的步伐骗了。当它手中的铁剑开始挥舞时，你会听到风的哀鸣，然后是铁与钢碰撞的声音。
unit.glow-耍小刀.name = 耍小刀
unit.glow-耍小刀.description = 它快，很快，非常快。每一次攻击都如同注射毒液般，在敌人的装甲上留下致命的裂缝。别眨眼，因为你可能看不清它是怎么冲到你面前的。
unit.glow-原子（？）.name = 原子（？）
unit.glow-原子（？）.description = 相比传统的单点打击武器，它更擅长用密集的弹幕对大面积区域进行压制。不过，由于能量消耗巨大，它的攻击间隔相当长。
unit.glow-大运.name = 大运
unit.glow-大运.description = 一辆超重载卡车，碾过敌人、碾过防线，撞到什么都算赚到。
unit.glow-国民军.name = 国民军
unit.glow-国民军.description = 本土动员的民兵，力量比不上联合军，但他们与当地人沾亲带故。同样是镇压，国民军动手时，对面可能会少几分决绝的反抗。
unit.glow-联合军.name = 联合军
unit.glow-联合军.description = 正规武装，火力强，装备精。但他们的出现，往往伴随着外部力量的影子，民众看他们的眼神里，带着疏远与戒备。
unit.glow-叛军.name = 叛军
unit.glow-叛军.description = 打得过就打，打不过就跑。你追他就钻山，你撤他就回头。
